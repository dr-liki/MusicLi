name: Stable Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release version
        id: version
        run: |
          BASE_VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          BASE_CODE="$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)"
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="$BASE_VERSION"
            TAG="v$BASE_VERSION"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$BASE_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Set up CI keystore
        env:
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$CI_KEYSTORE_B64" ] && [ -n "$CI_KEYSTORE_PASSWORD" ]; then
            KEYSTORE_PASSWORD="$CI_KEYSTORE_PASSWORD"
            printf '%s' "$CI_KEYSTORE_B64" | base64 -d > musicli-ci.jks
            KEY_ALIAS="$(keytool -list -keystore musicli-ci.jks -storepass "$KEYSTORE_PASSWORD" | awk -F',' '/PrivateKeyEntry/{print $1; exit}')"
          else
            KEY_ALIAS="musicli-ci-key"
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            keytool -genkey -v -keystore musicli-ci.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=MusicLi CI Throwaway, OU=Dev, O=MusicLi, L=World, S=World, C=US"
          fi
          {
            echo "storeFile=musicli-ci.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build split release APKs
        run: >
          ./gradlew :app:assembleRelease
          -Ppixelplayer.enableAbiSplits=true
          -PAPP_VERSION_NAME=${{ steps.version.outputs.name }}
          -PAPP_VERSION_CODE=${{ steps.version.outputs.code }}

      - name: Verify and stage split APKs
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          mkdir -p release-apks
          for abi in arm64-v8a armeabi-v7a; do
            apk="app/build/outputs/apk/release/app-$abi-release.apk"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
            cp "$apk" "release-apks/MusicLi-${{ steps.version.outputs.name }}-$abi.apk"
          done

      - name: Build universal release APK
        run: >
          ./gradlew :app:assembleRelease
          -Ppixelplayer.enableAbiSplits=false
          -PAPP_VERSION_NAME=${{ steps.version.outputs.name }}
          -PAPP_VERSION_CODE=${{ steps.version.outputs.code }}

      - name: Verify and stage universal APK
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          uni="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$uni" >/dev/null
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$uni"
          cp "$uni" "release-apks/MusicLi-${{ steps.version.outputs.name }}.apk"

      - name: Compress R8 mapping
        run: |
          mapping="app/build/outputs/mapping/release/mapping.txt"
          if [ -s "$mapping" ]; then
            mkdir -p release-mapping
            gzip -9 -c "$mapping" > "release-mapping/MusicLi-${{ steps.version.outputs.name }}-mapping.txt.gz"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          --generate-notes
          --title "MusicLi ${{ steps.version.outputs.name }}"
          release-apks/*.apk
          release-mapping/*.txt.gz
